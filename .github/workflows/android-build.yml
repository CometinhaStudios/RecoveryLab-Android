name: Android CI - Build APK

on:
  push:
    branches: [ "dev", "main" ]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: recoverylab-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Gerar Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Conceder permissão de execução ao gradlew
        run: chmod +x ./gradlew

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Testes unitários
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Compilar APK debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Publicar APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: recovery-lab-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publicar relatório de lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
